<!-- DO NOT DELETE! THIS IS WORKING OBSERVERS WHICH WILL BE USEFUL IN THE FUTURE -->

{% assign inst = 'Global' | PageParameter:'RegistrationInstanceId' %}
{% if inst == 625 %}
    <script>
    
        function updateTitle() {
            var title = $('div[blockguid="097b06ff-371b-40e0-8435-a0208fc838db"] h1');
            var needsUpdate = title.text().includes('Registration');
        
            if (title && needsUpdate) {
                title.text(title.text().replace('Registration', 'Purchase'));
            }
        };
    
        function updateH3() {
            var title2 = $('div.registrationentry-summary form div.well h4');
            var needsUpdate2 = title2.text().includes('Registration');
        
            if (title2 && needsUpdate2) {
                title2.text(title2.text().replace('Registration', 'Purchase'));
            }
        };
        
        const targetNode = document.querySelector('.dom-observer');
        const observer = new MutationObserver(updateTitle);
        const observer2 = new MutationObserver(updateH3);
        
        $(function() {
            updateTitle();
            updateH3();
            observer.observe(targetNode, { childList: true, subtree: true });
            observer2.observe(targetNode, { childList: true, subtree: true });
        });
    
    </script>
{% endif %}
